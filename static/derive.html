<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生成文章钥匙（本地计算）</title>
<style>
body { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; line-height: 1.8; }
input, textarea { width: 100%; font-size: 16px; padding: 10px; margin: 8px 0; box-sizing: border-box; }
button { font-size: 16px; padding: 10px 24px; cursor: pointer; }
.ok { color: #1a7f37; }
.err { color: #b03a2e; }
</style>
</head>
<body>
<h2>生成文章钥匙</h2>
<p>这个页面只做一件事：在本机浏览器里用你输入的密码算出一把专用钥匙。密码本身不会被发送到任何地方，也不会被带走；带走的只是这把钥匙——它只能解开这一篇文章，不能反推出你的密码，也不能用在别处。</p>
<label>访问密码<br><input type="password" id="pw1" autocomplete="off"></label><br>
<label>再输一次<br><input type="password" id="pw2" autocomplete="off"></label><br>
<button id="go">生成钥匙</button>
<p id="msg"></p>
<textarea id="output" rows="4" readonly placeholder="钥匙会出现在这里"></textarea>
<script>
const enc = new TextEncoder();
const b64 = (u8) => { let s = ''; u8.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
document.getElementById('go').addEventListener('click', async () => {
  const msg = document.getElementById('msg');
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  if (!pw1) { msg.textContent = '请先输入密码。'; msg.className = 'err'; return; }
  if (pw1 !== pw2) { msg.textContent = '两次输入不一致，请重新输入。'; msg.className = 'err'; return; }
  try {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const km = await crypto.subtle.importKey('raw', enc.encode(pw1), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
    const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
    document.getElementById('output').value = 'salt: ' + b64(salt) + '\nkey: ' + b64(raw);
    msg.textContent = '✓ 钥匙已生成。可以把浏览器交还了。';
    msg.className = 'ok';
  } catch (e) {
    msg.textContent = '生成失败，请重试。';
    msg.className = 'err';
  }
});
</script>
</body>
</html>
